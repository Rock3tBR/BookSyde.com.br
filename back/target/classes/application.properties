spring.application.name=booksyde-backend
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

# PostgreSQL/Supabase. Use the pooler URL in production when appropriate.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/booksyde}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DATABASE_POOL_MIN_IDLE:1}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=public

# The current BookSyde database already has a schema. Flyway starts from a safe baseline and does not recreate it.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.schemas=public
spring.flyway.default-schema=public

# Supabase Auth JWT validation.
booksyde.security.supabase-url=${SUPABASE_URL:http://localhost:54321}
booksyde.security.jwt-audience=${SUPABASE_JWT_AUDIENCE:authenticated}
booksyde.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.booksyde=${BOOKSYDE_LOG_LEVEL:INFO}

# Stripe is server-only. Never expose these keys through VITE_* variables.
booksyde.stripe.sandbox-secret-key=${STRIPE_SANDBOX_API_KEY:}
booksyde.stripe.live-secret-key=${STRIPE_LIVE_API_KEY:}
booksyde.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/marketplace?payment=success}
booksyde.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/marketplace?payment=cancel}

# Supabase Storage privileged operations are server-only.
booksyde.storage.supabase-service-role=${SUPABASE_SERVICE_ROLE_KEY:}
booksyde.storage.max-upload-bytes=${MAX_UPLOAD_BYTES:104857600}

# Resend and Google Drive are server-only.
booksyde.resend.api-key=${RESEND_API_KEY:}
booksyde.resend.from=${RESEND_FROM:BookSyde <noreply@booksyde.com.br>}
booksyde.google.drive-api-key=${GOOGLE_DRIVE_API_KEY:}

# Upload and HTTP hardening
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_BYTES:104857600}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_BYTES:104857600}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
